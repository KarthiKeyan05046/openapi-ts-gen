<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#accent)" rx="2"/>

  <!-- Icon: braces -->
  <text x="48" y="118" font-family="monospace" font-size="72" fill="url(#accent)" opacity="0.9">{ }</text>

  <!-- Title -->
  <text x="175" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">openapi-ts-gen</text>

  <!-- Subtitle -->
  <text x="177" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="0.2">OpenAPI 3.0 / 3.1  →  TypeScript types, route enums &amp; payload types</text>

  <!-- Badges row -->
  <rect x="177" y="150" width="72" height="22" fill="#1e293b" rx="4"/>
  <text x="213" y="165" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">CLI tool</text>

  <rect x="259" y="150" width="80" height="22" fill="#1e293b" rx="4"/>
  <text x="299" y="165" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">TypeScript</text>

  <rect x="349" y="150" width="60" height="22" fill="#1e293b" rx="4"/>
  <text x="379" y="165" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">ESM</text>
</svg>
