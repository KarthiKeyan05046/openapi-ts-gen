<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#0D1025"/>
    </linearGradient>

    <linearGradient id="topGlow" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="braceGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>

  <!-- Top Glow -->
  <rect width="900" height="4" fill="url(#topGlow)"/>

  <!-- Braces -->
  <text x="55" y="120"
        font-family="Inter, Arial, sans-serif"
        font-size="110"
        font-weight="700"
        fill="url(#braceGradient)">
    {
  </text>

  <text x="145" y="120"
        font-family="Inter, Arial, sans-serif"
        font-size="110"
        font-weight="700"
        fill="url(#braceGradient)">
    }
  </text>

  <!-- Title -->
  <text x="220" y="92"
        font-family="Inter, Arial, sans-serif"
        font-size="44"
        font-weight="800"
        fill="#FFFFFF">
    typeoapi
  </text>

  <!-- Subtitle -->
  <text x="220" y="130"
        font-family="Inter, Arial, sans-serif"
        font-size="20"
        font-weight="500"
        fill="#9CA3AF">
    OpenAPI 2.0 / 3.0 / 3.1 → TypeScript types, route enums &amp; payload types
  </text>

  <!-- Badges -->
  <g filter="url(#shadow)">
    <!-- CLI -->
    <rect x="220" y="155" width="110" height="34" rx="8" fill="#111827"/>
    <text x="245" y="177"
          font-family="JetBrains Mono, monospace"
          font-size="16"
          fill="#3B82F6">
      CLI tool
    </text>

    <!-- TypeScript -->
    <rect x="345" y="155" width="145" height="34" rx="8" fill="#1E1B4B"/>
    <text x="368" y="177"
          font-family="JetBrains Mono, monospace"
          font-size="16"
          fill="#A855F7">
      TypeScript
    </text>

    <!-- ESM -->
    <rect x="505" y="155" width="85" height="34" rx="8" fill="#0F172A"/>
    <text x="535" y="177"
          font-family="JetBrains Mono, monospace"
          font-size="16"
          fill="#10B981">
      ESM
    </text>
  </g>
</svg>
